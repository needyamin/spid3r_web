<footer class="sz-footer text-center py-4 mt-5">
  <div class="container">
    <div class="mb-1">🛍️ <strong>Spid3r Bazaar</strong></div>

</footer>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="szToasts"></div>

<script>
// ---------- Toast alerts ----------
function szNotify(message, type) {
  const wrap = document.getElementById('szToasts');
  const el = document.createElement('div');
  const bg = type === 'error' ? 'sz-toast-error' : 'sz-toast-success';
  const icon = type === 'error' ? '⚠️' : '✅';
  el.className = 'sz-toast ' + bg;
  el.innerHTML = '<span>' + icon + '</span><span>' + message + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('sz-toast-hide'); }, 2600);
  setTimeout(() => { el.remove(); }, 3000);
}

function szSetBadge(n) {
  document.querySelectorAll('.sz-cart-badge').forEach(b => { b.textContent = n; });
}

async function szPost(form) {
  // URLSearchParams → application/x-www-form-urlencoded body, which the
  // framework's request parser understands (FormData would send multipart).
  // NOTE: `form` must be the <form> element — new FormData() only accepts forms.
  const res = await fetch(form.action, {
    method: 'POST',
    body: new URLSearchParams(new FormData(form)),
    headers: {
      'X-Requested-With': 'XMLHttpRequest',
      'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
      'Accept': 'application/json'
    },
    credentials: 'same-origin'
  });
  const type = res.headers.get('content-type') || '';
  if (!res.ok || type.indexOf('application/json') === -1) {
    throw new Error('Unexpected response (' + res.status + ')');
  }
  return res.json();
}

// ---------- No-reload cart mutations ----------
document.addEventListener('submit', async (e) => {
  const f = e.target;

  // Add to cart (store pages)
  if (f.classList.contains('js-cart-add')) {
    e.preventDefault();
    try {
      const data = await szPost(f);
      if (data.ok) {
        szNotify(data.message + ' — ' + data.cart_count + ' item(s) in cart');
        szSetBadge(data.cart_count);
      } else {
        szNotify(data.message || 'Could not add to cart', 'error');
      }
    } catch (err) {
      // AJAX failed — fall back to a normal (non-JS) form submission so the
      // action still completes; the server redirects back appropriately.
      console.error('Cart request failed:', err);
      HTMLFormElement.prototype.submit.call(f);
    }
    return;
  }

  // Update quantity (cart page)
  if (f.classList.contains('js-cart-update')) {
    e.preventDefault();
    const row = f.closest('[data-price]');
    const qty = parseInt(f.querySelector('[name="qty"]').value, 10) || 0;
    try {
      const data = await szPost(f);
      if (data.ok) {
        szSetBadge(data.cart_count);
        document.querySelectorAll('.sz-cart-total').forEach(el => { el.textContent = '৳' + data.total; });
        if (qty <= 0) {
          szNotify('Removed from cart');
          row.remove();
          szMaybeEmptyCart();
        } else {
          szNotify('Quantity updated');
          // per-line subtotal: recompute locally from data-price
          row.querySelector('.sz-line-subtotal').textContent = '৳' + (parseInt(row.dataset.price, 10) * qty);
        }
      } else {
        szNotify(data.message || 'Update failed', 'error');
      }
    } catch (err) {
      // AJAX failed — fall back to a normal (non-JS) form submission so the
      // action still completes; the server redirects back appropriately.
      console.error('Cart request failed:', err);
      HTMLFormElement.prototype.submit.call(f);
    }
    return;
  }

  // Remove item (cart page)
  if (f.classList.contains('js-cart-remove')) {
    e.preventDefault();
    const row = f.closest('[data-price]');
    try {
      const data = await szPost(f);
      if (data.ok) {
        szSetBadge(data.cart_count);
        document.querySelectorAll('.sz-cart-total').forEach(el => { el.textContent = '৳' + data.total; });
        szNotify('Removed from cart');
        row.remove();
        szMaybeEmptyCart();
      } else {
        szNotify(data.message || 'Remove failed', 'error');
      }
    } catch (err) {
      // AJAX failed — fall back to a normal (non-JS) form submission so the
      // action still completes; the server redirects back appropriately.
      console.error('Cart request failed:', err);
      HTMLFormElement.prototype.submit.call(f);
    }
    return;
  }
});

function szMaybeEmptyCart() {
  if (document.querySelectorAll('[data-price]').length === 0) {
    setTimeout(() => { window.location.reload(); }, 600);
  }
}
</script>

</body>
</html>
