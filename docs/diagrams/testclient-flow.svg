<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#ffffff;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="tcShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tcHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="tcArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="tcGreenArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="18" width="940" height="60" rx="10" fill="url(#tcHeaderGrad)"/>
  <text x="45" y="54" fill="#ddd6fe" font-size="22" font-weight="800">🧪 Fluent TestClient Architecture</text>
  <text x="420" y="54" fill="#ede9fe" font-size="14" font-weight="500">In-Memory Integration Testing with Zero Socket Overhead</text>
  <rect x="850" y="34" width="95" height="26" rx="13" fill="#a855f7"/>
  <text x="897" y="51" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">In-Process</text>

  <!-- Stage 1: Fluent Client Setup & Request Builder -->
  <g filter="url(#tcShadow)">
    <rect x="30" y="100" width="280" height="440" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <rect x="30" y="100" width="280" height="34" rx="10" fill="#ede9fe"/>
    <text x="45" y="122" fill="#581c87" font-size="13" font-weight="800">1. FLUENT REQUEST BUILDER</text>

    <!-- Code Card -->
    <rect x="42" y="145" width="256" height="150" rx="6" fill="#0f172a"/>
    <text x="52" y="167" fill="#c084fc" font-size="11" font-family="monospace">let client = app.test_client();</text>
    <text x="52" y="192" fill="#e2e8f0" font-size="10.5" font-family="monospace">client</text>
    <text x="64" y="212" fill="#86efac" font-size="10.5" font-family="monospace">.acting_as(user)</text>
    <text x="64" y="232" fill="#93c5fd" font-size="10.5" font-family="monospace">.with_header("X-Id", "1")</text>
    <text x="64" y="252" fill="#fde047" font-size="10.5" font-family="monospace">.post_json("/posts", {</text>
    <text x="76" y="272" fill="#cbd5e1" font-size="10.5" font-family="monospace">"title": "Modern Spid3r"</text>
    <text x="64" y="287" fill="#fde047" font-size="10.5" font-family="monospace">})</text>

    <!-- Features list -->
    <text x="45" y="325" fill="#0f172a" font-size="12" font-weight="700">Capabilities:</text>
    <text x="45" y="348" fill="#475569" font-size="11.5">• <strong>acting_as(user):</strong> mints JWT HS256</text>
    <text x="45" y="370" fill="#475569" font-size="11.5">• <strong>with_token(jwt):</strong> Bearer token</text>
    <text x="45" y="392" fill="#475569" font-size="11.5">• <strong>with_cookie(k, v):</strong> test sessions</text>
    <text x="45" y="414" fill="#475569" font-size="11.5">• <strong>post_json() / get():</strong> clean verbs</text>
    <text x="45" y="436" fill="#475569" font-size="11.5">• <strong>put_json() / patch_json()</strong></text>
    <text x="45" y="458" fill="#475569" font-size="11.5">• <strong>delete():</strong> restful testing</text>
    <text x="45" y="490" fill="#7c3aed" font-size="11.5" font-weight="700">✓ No socket binding / No ports</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <line x1="310" y1="280" x2="338" y2="280" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#tcArrow)"/>

  <!-- Stage 2: Direct Kernel Dispatch (In-Memory) -->
  <g filter="url(#tcShadow)">
    <rect x="345" y="100" width="290" height="440" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect x="345" y="100" width="290" height="34" rx="10" fill="#dcfce7"/>
    <text x="360" y="122" fill="#14532d" font-size="13" font-weight="800">2. IN-MEMORY HTTP KERNEL</text>

    <!-- Inner Dispatch Box -->
    <rect x="357" y="145" width="266" height="60" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <text x="370" y="170" fill="#15803d" font-size="12" font-weight="700">Application.handle_request()</text>
    <text x="370" y="190" fill="#475569" font-size="11">Direct in-process function invocation</text>

    <!-- Full Stack Layers Inside Kernel -->
    <rect x="357" y="215" width="266" height="230" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="370" y="235" fill="#0f172a" font-size="11" font-weight="700">Full Production Stack Traversal:</text>

    <rect x="370" y="248" width="240" height="26" rx="4" fill="#eff6ff"/>
    <text x="380" y="265" fill="#1e40af" font-size="10.5">1. ServiceProvider Booting</text>

    <rect x="370" y="280" width="240" height="26" rx="4" fill="#f5f3ff"/>
    <text x="380" y="297" fill="#6d28d9" font-size="10.5">2. Auth &amp; JWT Verification</text>

    <rect x="370" y="312" width="240" height="26" rx="4" fill="#fef2f2"/>
    <text x="380" y="329" fill="#991b1b" font-size="10.5">3. Onion Middleware Pipeline</text>

    <rect x="370" y="344" width="240" height="26" rx="4" fill="#ecfdf5"/>
    <text x="380" y="361" fill="#065f46" font-size="10.5">4. O(1) &amp; Prefix Router</text>

    <rect x="370" y="376" width="240" height="26" rx="4" fill="#fffbeb"/>
    <text x="380" y="393" fill="#92400e" font-size="10.5">5. Controller &amp; ORM Models</text>

    <rect x="370" y="408" width="240" height="26" rx="4" fill="#f1f5f9"/>
    <text x="380" y="425" fill="#334155" font-size="10.5">6. Response Auto-Coercion</text>

    <text x="360" y="475" fill="#15803d" font-size="12" font-weight="700">⚡ 0 Network Latency</text>
    <text x="360" y="495" fill="#475569" font-size="11.5">• 100% faithful to live server behavior</text>
    <text x="360" y="515" fill="#475569" font-size="11.5">• 17/17 test suites execute in seconds</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <line x1="635" y1="280" x2="665" y2="280" stroke="#10b981" stroke-width="2.5" marker-end="url(#tcGreenArrow)"/>

  <!-- Stage 3: Fluent TestResponse Assertions -->
  <g filter="url(#tcShadow)">
    <rect x="670" y="100" width="280" height="440" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="670" y="100" width="280" height="34" rx="10" fill="#dbeafe"/>
    <text x="685" y="122" fill="#1e40af" font-size="13" font-weight="800">3. FLUENT ASSERTIONS</text>

    <!-- Assertion Code Box -->
    <rect x="682" y="145" width="256" height="150" rx="6" fill="#0f172a"/>
    <text x="692" y="167" fill="#93c5fd" font-size="11" font-family="monospace">res</text>
    <text x="702" y="190" fill="#86efac" font-size="10.5" font-family="monospace">.assert_created()</text>
    <text x="702" y="212" fill="#86efac" font-size="10.5" font-family="monospace">.assert_json_path(</text>
    <text x="714" y="232" fill="#fde047" font-size="10.5" font-family="monospace">"title", "Modern Spid3r"</text>
    <text x="702" y="252" fill="#86efac" font-size="10.5" font-family="monospace">)</text>
    <text x="702" y="272" fill="#86efac" font-size="10.5" font-family="monospace">.assert_header("content-type")</text>

    <!-- Assertion Helpers -->
    <text x="685" y="325" fill="#0f172a" font-size="12" font-weight="700">Available Assertions:</text>
    <text x="685" y="348" fill="#475569" font-size="11.5">• <strong>assert_ok():</strong> 200 OK</text>
    <text x="685" y="370" fill="#475569" font-size="11.5">• <strong>assert_created():</strong> 201 Created</text>
    <text x="685" y="392" fill="#475569" font-size="11.5">• <strong>assert_unauthorized():</strong> 401</text>
    <text x="685" y="414" fill="#475569" font-size="11.5">• <strong>assert_unprocessable():</strong> 422</text>
    <text x="685" y="436" fill="#475569" font-size="11.5">• <strong>assert_json_path(path, val)</strong></text>
    <text x="685" y="458" fill="#475569" font-size="11.5">• <strong>assert_see(str) / dont_see(str)</strong></text>
    <text x="685" y="480" fill="#475569" font-size="11.5">• <strong>assert_header(key, val)</strong></text>
    <text x="685" y="502" fill="#15803d" font-size="11.5" font-weight="700">✓ Chainable fluent syntax</text>
  </g>
</svg>

