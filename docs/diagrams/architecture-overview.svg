<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#ffffff;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="frameworkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="64" rx="10" fill="url(#headerGrad)"/>
  <text x="45" y="58" fill="#38bdf8" font-size="24" font-weight="800">🕷️ Spid3rWeb Architecture</text>
  <text x="365" y="58" fill="#94a3b8" font-size="15" font-weight="500">Tiered Zero-Dependency MVC Architecture</text>
  <rect x="800" y="38" width="120" height="28" rx="14" fill="#2563eb"/>
  <text x="860" y="56" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">v2.0 Modern</text>

  <!-- Tier 3: User Application Layer -->
  <g filter="url(#shadow)">
    <rect x="20" y="104" width="920" height="136" rx="10" fill="url(#appGrad)" stroke="#86efac" stroke-width="1.5"/>
    <rect x="36" y="118" width="230" height="26" rx="6" fill="#16a34a"/>
    <text x="151" y="135" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">USER APPLICATION LAYER (app/)</text>

    <!-- App Cards -->
    <rect x="36" y="154" width="160" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="48" y="176" fill="#15803d" font-size="13" font-weight="700">Controllers</text>
    <text x="48" y="196" fill="#475569" font-size="11">app/Controllers/</text>
    <text x="48" y="212" fill="#64748b" font-size="10">HTTP Request Handlers</text>

    <rect x="210" y="154" width="160" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="222" y="176" fill="#15803d" font-size="13" font-weight="700">Models</text>
    <text x="222" y="196" fill="#475569" font-size="11">app/Models/</text>
    <text x="222" y="212" fill="#64748b" font-size="10">ActiveRecord &amp; Casts</text>

    <rect x="384" y="154" width="160" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="396" y="176" fill="#15803d" font-size="13" font-weight="700">Views &amp; Static</text>
    <text x="396" y="196" fill="#475569" font-size="11">resources/views/</text>
    <text x="396" y="212" fill="#64748b" font-size="10">SpiderBD v2 (.bd.html)</text>

    <rect x="558" y="154" width="170" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="570" y="176" fill="#15803d" font-size="13" font-weight="700">Routes &amp; Config</text>
    <text x="570" y="196" fill="#475569" font-size="11">routes/ · config/</text>
    <text x="570" y="212" fill="#64748b" font-size="10">web, api, queue, db configs</text>

    <rect x="742" y="154" width="180" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="754" y="176" fill="#15803d" font-size="13" font-weight="700">Providers &amp; CLI</text>
    <text x="754" y="196" fill="#475569" font-size="11">app/Providers/ · magic</text>
    <text x="754" y="212" fill="#64748b" font-size="10">Boot lifecycle &amp; CLI tasks</text>
  </g>

  <!-- Flow Arrow down to Framework -->
  <line x1="480" y1="240" x2="480" y2="258" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Tier 2: Spid3rWeb Framework Layer -->
  <g filter="url(#shadow)">
    <rect x="20" y="260" width="920" height="194" rx="10" fill="url(#frameworkGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="36" y="272" width="280" height="26" rx="6" fill="#2563eb"/>
    <text x="176" y="289" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">SPID3RWEB FRAMEWORK CORE (framework/)</text>
    <text x="330" y="289" fill="#1e40af" font-size="12" font-weight="600">Single import: import "framework/Web";</text>

    <!-- Framework Modules -->
    <!-- Row 1: HTTP & Routing -->
    <rect x="36" y="308" width="205" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="48" y="328" fill="#1d4ed8" font-size="12" font-weight="700">Application Kernel</text>
    <text x="48" y="346" fill="#475569" font-size="11">Request, Response, ETag</text>
    <text x="48" y="360" fill="#64748b" font-size="10">CSRF Guard · Session commit</text>

    <rect x="253" y="308" width="215" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="265" y="328" fill="#1d4ed8" font-size="12" font-weight="700">O(1) &amp; Prefix Router</text>
    <text x="265" y="346" fill="#475569" font-size="11">133,333 ops/sec on VM</text>
    <text x="265" y="360" fill="#64748b" font-size="10">Static O(1) · 2-level buckets</text>

    <rect x="480" y="308" width="215" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="492" y="328" fill="#1d4ed8" font-size="12" font-weight="700">Onion Middleware</text>
    <text x="492" y="346" fill="#475569" font-size="11">True nested pipeline</text>
    <text x="492" y="360" fill="#64748b" font-size="10">auth, cors, throttle, logger</text>

    <rect x="707" y="308" width="215" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="719" y="328" fill="#1d4ed8" font-size="12" font-weight="700">Auth, JWT &amp; Sessions</text>
    <text x="719" y="346" fill="#475569" font-size="11">HS256 stateless Bearer JWT</text>
    <text x="719" y="360" fill="#64748b" font-size="10">0 DB hits · DB sessions &amp; flash</text>

    <!-- Row 2: Data, Views, Systems -->
    <rect x="36" y="380" width="205" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="48" y="400" fill="#1d4ed8" font-size="12" font-weight="700">Zero-Boilerplate ORM</text>
    <text x="48" y="418" fill="#475569" font-size="11">QueryBuilder · Migrations</text>
    <text x="48" y="432" fill="#64748b" font-size="10">Dialects: SQLite, PG, MySQL</text>

    <rect x="253" y="380" width="215" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="265" y="400" fill="#1d4ed8" font-size="12" font-weight="700">SpiderBD v2 Views</text>
    <text x="265" y="418" fill="#475569" font-size="11">Pre-compiled line cache</text>
    <text x="265" y="432" fill="#64748b" font-size="10">9,569 ops/sec · @if, @foreach</text>

    <rect x="480" y="380" width="215" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="492" y="400" fill="#1d4ed8" font-size="12" font-weight="700">Systems &amp; Services</text>
    <text x="492" y="418" fill="#475569" font-size="11">Cache · Log · Queue · Mail</text>
    <text x="492" y="432" fill="#64748b" font-size="10">Event Bus · DI Container</text>

    <rect x="707" y="380" width="215" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="719" y="400" fill="#1d4ed8" font-size="12" font-weight="700">Testing &amp; CLI</text>
    <text x="719" y="418" fill="#475569" font-size="11">TestClient · 17 Test Suites</text>
    <text x="719" y="432" fill="#64748b" font-size="10">Magic CLI scaffolding &amp; ops</text>
  </g>

  <!-- Flow Arrow down to Runtime -->
  <line x1="480" y1="454" x2="480" y2="472" stroke="#ea580c" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Tier 1: Spid3r Native Runtime -->
  <g filter="url(#shadow)">
    <rect x="20" y="474" width="920" height="126" rx="10" fill="url(#runtimeGrad)" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="36" y="486" width="260" height="26" rx="6" fill="#ea580c"/>
    <text x="166" y="503" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">SPID3R RUST RUNTIME (Native Binary)</text>
    <text x="310" y="503" fill="#9a3412" font-size="12" font-weight="600">Zero external C / NPM dependencies</text>

    <rect x="36" y="522" width="205" height="66" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="48" y="542" fill="#c2410c" font-size="12" font-weight="700">Multi-Threaded HTTP</text>
    <text x="48" y="560" fill="#475569" font-size="11">serve_listener worker pool</text>
    <text x="48" y="574" fill="#64748b" font-size="10">TCP sockets · RFC 6455 WS</text>

    <rect x="253" y="522" width="215" height="66" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="265" y="542" fill="#c2410c" font-size="12" font-weight="700">Native DB Drivers</text>
    <text x="265" y="560" fill="#475569" font-size="11">SQLite · PostgreSQL · MySQL</text>
    <text x="265" y="574" fill="#64748b" font-size="10">Direct native C/Rust bindings</text>

    <rect x="480" y="522" width="215" height="66" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="492" y="542" fill="#c2410c" font-size="12" font-weight="700">Crypto &amp; Concurrency</text>
    <text x="492" y="560" fill="#475569" font-size="11">bcrypt_hash · hmac_sha256</text>
    <text x="492" y="574" fill="#64748b" font-size="10">secure_compare · Mutex locks</text>

    <rect x="707" y="522" width="215" height="66" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="719" y="542" fill="#c2410c" font-size="12" font-weight="700">VM &amp; Standard Lib</text>
    <text x="719" y="560" fill="#475569" font-size="11">Bytecode VM · Tree-walk</text>
    <text x="719" y="574" fill="#64748b" font-size="10">NFA Regex · JSON parser</text>
  </g>
</svg>

