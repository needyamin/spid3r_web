<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#ffffff;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="dbShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="dbHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <marker id="dbArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="18" width="940" height="60" rx="10" fill="url(#dbHeaderGrad)"/>
  <text x="45" y="54" fill="#a5f3fc" font-size="22" font-weight="800">🗄️ MVC &amp; Zero-Boilerplate ORM Architecture</text>
  <text x="500" y="54" fill="#e0f2fe" font-size="14" font-weight="500">1-Line Model Repositories · Multi-DB Dialects</text>

  <!-- Column 1: Controller & Model Definition -->
  <g filter="url(#dbShadow)">
    <rect x="30" y="100" width="280" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="30" y="100" width="280" height="34" rx="10" fill="#f1f5f9"/>
    <text x="45" y="122" fill="#334155" font-size="13" font-weight="800">1. CONTROLLER &amp; MODEL DEF</text>

    <!-- Code Box -->
    <rect x="42" y="145" width="256" height="150" rx="6" fill="#0f172a"/>
    <text x="52" y="167" fill="#38bdf8" font-size="11" font-family="monospace">let Post = model("posts", {</text>
    <text x="62" y="187" fill="#e2e8f0" font-size="10.5" font-family="monospace">"fillable": ["title", "body"],</text>
    <text x="62" y="207" fill="#e2e8f0" font-size="10.5" font-family="monospace">"hidden":   ["internal_key"],</text>
    <text x="62" y="227" fill="#e2e8f0" font-size="10.5" font-family="monospace">"casts": {</text>
    <text x="75" y="247" fill="#a5f3fc" font-size="10.5" font-family="monospace">"published": "bool",</text>
    <text x="75" y="267" fill="#a5f3fc" font-size="10.5" font-family="monospace">"metadata":  "json"</text>
    <text x="52" y="287" fill="#38bdf8" font-size="11" font-family="monospace">});</text>

    <!-- Model Features -->
    <text x="45" y="325" fill="#0f172a" font-size="12" font-weight="700">Model Features:</text>
    <text x="45" y="348" fill="#475569" font-size="11.5">• <strong>Casts:</strong> auto string/int/bool/json</text>
    <text x="45" y="370" fill="#475569" font-size="11.5">• <strong>Hidden:</strong> auto-stripped on to_map()</text>
    <text x="45" y="392" fill="#475569" font-size="11.5">• <strong>Dirty Tracking:</strong> is_dirty(), get_dirty()</text>
    <text x="45" y="414" fill="#475569" font-size="11.5">• <strong>Eager Loading:</strong> load_has_many()</text>
    <text x="45" y="436" fill="#475569" font-size="11.5">• <strong>CRUD Helpers:</strong> find_or_fail(id)</text>
    <text x="45" y="458" fill="#475569" font-size="11.5">• <strong>Pagination:</strong> paginate(page, per_page)</text>
    <text x="45" y="480" fill="#475569" font-size="11.5">• <strong>Upsert:</strong> update_or_create()</text>
    <text x="45" y="502" fill="#15803d" font-size="11.5" font-weight="700">✓ Zero boiler-plate schema mapping</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <line x1="310" y1="280" x2="338" y2="280" stroke="#0284c7" stroke-width="2.5" marker-end="url(#dbArrow)"/>

  <!-- Column 2: QueryBuilder & Schema Layer -->
  <g filter="url(#dbShadow)">
    <rect x="345" y="100" width="290" height="440" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="345" y="100" width="290" height="34" rx="10" fill="#e0f2fe"/>
    <text x="360" y="122" fill="#0369a1" font-size="13" font-weight="800">2. QUERYBUILDER &amp; TRANSACTIONS</text>

    <!-- QueryBuilder Box -->
    <rect x="357" y="145" width="266" height="135" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="370" y="170" fill="#0369a1" font-size="12" font-weight="700">Fluent QueryBuilder API</text>
    <text x="370" y="195" fill="#334155" font-size="11.5">• <code>DB.table("posts")</code></text>
    <text x="370" y="215" fill="#334155" font-size="11.5">• <code>.where("active", 1)</code></text>
    <text x="370" y="235" fill="#334155" font-size="11.5">• <code>.whereIn("cat_id", [1,2,3])</code></text>
    <text x="370" y="255" fill="#334155" font-size="11.5">• <code>.join("users", "posts.uid", "users.id")</code></text>

    <!-- Mutex Transactions -->
    <rect x="357" y="295" width="266" height="110" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="370" y="320" fill="#0369a1" font-size="12" font-weight="700">Thread-Safe DB.transaction()</text>
    <text x="370" y="342" fill="#475569" font-size="11">• Mutex-serialized execution</text>
    <text x="370" y="360" fill="#475569" font-size="11">• Auto COMMIT on closure success</text>
    <text x="370" y="378" fill="#dc2626" font-size="11">• Auto ROLLBACK on exception</text>
    <text x="370" y="396" fill="#15803d" font-size="11">✓ Safe across concurrent workers</text>

    <!-- Schema Builder -->
    <rect x="357" y="420" width="266" height="105" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="370" y="445" fill="#0369a1" font-size="12" font-weight="700">Schema &amp; Migrations</text>
    <text x="370" y="467" fill="#475569" font-size="11">• <code>Schema.create("posts", t =&gt; ...)</code></text>
    <text x="370" y="485" fill="#475569" font-size="11">• Auto-discovering migration runner</text>
    <text x="370" y="503" fill="#475569" font-size="11">• Rollback batches tracking</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <line x1="635" y1="280" x2="665" y2="280" stroke="#0284c7" stroke-width="2.5" marker-end="url(#dbArrow)"/>

  <!-- Column 3: Multi-DB Dialects & Native Drivers -->
  <g filter="url(#dbShadow)">
    <rect x="670" y="100" width="280" height="440" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="670" y="100" width="280" height="34" rx="10" fill="#ffedd5"/>
    <text x="685" y="122" fill="#c2410c" font-size="13" font-weight="800">3. NATIVE DRIVERS &amp; ENGINES</text>

    <!-- Dialect Cards -->
    <rect x="685" y="150" width="250" height="80" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
    <text x="698" y="174" fill="#ea580c" font-size="13" font-weight="700">SQLite (Embedded)</text>
    <text x="698" y="196" fill="#475569" font-size="11">Driver: sqlite · Zero-config</text>
    <text x="698" y="214" fill="#64748b" font-size="10.5">Parameterized bindings: ?</text>

    <rect x="685" y="245" width="250" height="80" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
    <text x="698" y="269" fill="#ea580c" font-size="13" font-weight="700">PostgreSQL (Production)</text>
    <text x="698" y="291" fill="#475569" font-size="11">Driver: pgsql · Connection pool</text>
    <text x="698" y="309" fill="#64748b" font-size="10.5">Parameterized bindings: $1, $2</text>

    <rect x="685" y="340" width="250" height="80" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
    <text x="698" y="364" fill="#ea580c" font-size="13" font-weight="700">MySQL / MariaDB</text>
    <text x="698" y="386" fill="#475569" font-size="11">Driver: mysql · High-throughput</text>
    <text x="698" y="404" fill="#64748b" font-size="10.5">Backtick quoting · ? bindings</text>

    <!-- Rust Native Box -->
    <rect x="685" y="435" width="250" height="90" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="698" y="459" fill="#be123c" font-size="12" font-weight="700">Native Spid3r Runtime</text>
    <text x="698" y="479" fill="#475569" font-size="11">• Multi-threaded safe bindings</text>
    <text x="698" y="497" fill="#475569" font-size="11">• 20,547 query ops/sec on VM</text>
    <text x="698" y="515" fill="#be123c" font-size="10.5" font-weight="600">✓ Zero external C libraries required</text>
  </g>
</svg>

