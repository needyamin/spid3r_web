<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="mShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="onionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="inArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="outArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="18" width="920" height="60" rx="10" fill="url(#onionGrad)"/>
  <text x="45" y="54" fill="#ddd6fe" font-size="22" font-weight="800">🧅 True Onion Middleware Pipeline</text>
  <text x="440" y="54" fill="#ede9fe" font-size="14" font-weight="500">Dual-Pass Wrapping: (req, next) =&gt; { let res = next(req); return res; }</text>

  <!-- Concentric Rings / Visual Onion Container -->
  <!-- Layer 1: CORS & Security Headers -->
  <rect x="50" y="100" width="860" height="420" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="130" fill="#475569" font-size="13" font-weight="700">LAYER 1: CORS &amp; Security Headers (Global)</text>
  <text x="730" y="130" fill="#64748b" font-size="12">CorsMiddleware</text>

  <!-- Layer 2: Logging & Request ID -->
  <rect x="90" y="150" width="780" height="330" rx="16" fill="#f1f5f9" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="180" fill="#1e40af" font-size="13" font-weight="700">LAYER 2: Request ID &amp; HTTP Logging</text>
  <text x="700" y="180" fill="#2563eb" font-size="12">LoggerMiddleware</text>

  <!-- Layer 3: Rate Limiting & Throttling -->
  <rect x="130" y="200" width="700" height="240" rx="12" fill="#eff6ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="160" y="230" fill="#5b21b6" font-size="13" font-weight="700">LAYER 3: Rate Limiter (throttle:60,60)</text>
  <text x="640" y="230" fill="#7c3aed" font-size="12">ThrottleMiddleware</text>

  <!-- Layer 4: Authentication & Authorization -->
  <rect x="170" y="250" width="620" height="150" rx="10" fill="#faf5ff" stroke="#f472b6" stroke-width="2"/>
  <text x="200" y="280" fill="#9d174d" font-size="13" font-weight="700">LAYER 4: Authentication &amp; Guard</text>
  <text x="650" y="280" fill="#db2777" font-size="12">AuthMiddleware</text>

  <!-- Core: Handler / Controller -->
  <rect x="230" y="300" width="500" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#mShadow)"/>
  <text x="480" y="332" fill="#38bdf8" font-size="16" font-weight="800" text-anchor="middle">🎯 Route Handler / Controller</text>
  <text x="480" y="352" fill="#94a3b8" font-size="12" text-anchor="middle">Executes business logic, queries ORM models, returns Response</text>

  <!-- Inbound Flow Arrow (Blue, Downwards Left) -->
  <path d="M 70 88 L 70 335 L 218 335" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#inArrow)"/>
  <rect x="60" y="235" width="135" height="42" rx="6" fill="#2563eb"/>
  <text x="127" y="252" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">INBOUND PASS</text>
  <text x="127" y="268" fill="#dbeafe" font-size="10" text-anchor="middle">Inspect &amp; Mutate req</text>

  <!-- Outbound Flow Arrow (Green, Upwards Right) -->
  <path d="M 742 335 L 890 335 L 890 88" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#outArrow)"/>
  <rect x="765" y="235" width="145" height="42" rx="6" fill="#10b981"/>
  <text x="837" y="252" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">OUTBOUND PASS</text>
  <text x="837" y="268" fill="#d1fae5" font-size="10" text-anchor="middle">Inspect &amp; Mutate res</text>

  <!-- Inbound label top -->
  <text x="80" y="94" fill="#2563eb" font-size="12" font-weight="700">Incoming Request ➔</text>
  <!-- Outbound label top -->
  <text x="760" y="94" fill="#059669" font-size="12" font-weight="700">➔ Outgoing Response</text>
</svg>

